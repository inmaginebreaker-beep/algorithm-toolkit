changelog:
  categories:
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"

    - title: "Bug Fixes"
      labels:
        - "bug"
        - "fix"

    - title: "Documentation"
      labels:
        - "documentation"

    - title: "Maintenance"
      labels:
        - "dependencies"
        - "maintenance"
        - "ci"

    - title: "Other Changes"
      labels:
        - "*"

  exclude:
    labels:
      - "skip-changelog"