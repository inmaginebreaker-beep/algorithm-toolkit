[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "algorithm-toolkit"
version = "0.1.0"
description = "Algorithm practice project"
requires-python = ">=3.10"

dependencies = []


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]


[tool.setuptools.packages.find]
where = ["src"]