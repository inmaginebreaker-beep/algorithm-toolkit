[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kuroki-algorithm-toolkit"
version = "0.2.0"
description = "A command-line toolkit for practicing Python algorithms"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Kuroki" },
]

keywords = [
    "algorithms",
    "data-structures",
    "cli",
    "education",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]


dependencies = [
    "python-dotenv>=1.0",
]


[project.urls]
Repository = "https://github.com/inmaginebreaker-beep/algorithm-toolkit"
Issues = "https://github.com/inmaginebreaker-beep/algorithm-toolkit/issues"

[project.optional-dependencies]
dev = [
    "build",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "tomli>=2.0",
    "twine",
]

[project.scripts]
algorithm-toolkit = "algorithm_toolkit.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]


[tool.mypy]
python_version = "3.10"
files = [
    "src",
    "tests",
]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
pretty = true


